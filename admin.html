<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Admin Panel | CJ Cyber Links</title><link rel="stylesheet" href="styles.css?v=dark1"></head>
<body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">CJ</span><span>CJ <b>CYBER LINKS</b><small>ADMIN CONSOLE</small></span></a><div class="admin-actions"><span id="adminEmail" class="muted"></span><button id="logoutBtn" class="outline-btn">LOG OUT</button></div></header>
<main class="shell directory"><a class="backlink" href="index.html">← HOME</a><div class="eyebrow"><span class="pulse"></span> CONTROL CENTER</div><h1>LINK <span>MANAGER</span></h1><p class="muted">Add, edit, enable, or delete directory links.</p>
<section class="admin-panel"><form id="linkForm"><input type="hidden" id="linkId"><div class="form-grid"><label>Link title<input id="linkTitle" required maxlength="100" placeholder="Example: Official Player Site"></label><label>Category<select id="linkKind"><option value="player">PLAYER LINK</option><option value="agent">AGENT LINK</option></select></label><label class="wide">Website URL<input id="linkUrl" type="url" required placeholder="https://example.com"></label><label class="wide">Short description<input id="linkDescription" maxlength="240" placeholder="Optional note about this website"></label><label class="check-label"><input id="linkEnabled" type="checkbox" checked> Visible on website</label></div><div class="form-actions"><button class="primary-btn" type="submit" id="saveBtn">＋ SAVE LINK</button><button class="outline-btn" type="button" id="cancelEdit" hidden>CANCEL EDIT</button></div><p id="formMessage" class="message"></p></form></section>
<section class="admin-panel"><div class="table-heading"><h2>ALL LINKS</h2><button id="refreshBtn" class="outline-btn">↻ REFRESH</button></div><div id="adminLinks" class="admin-list"><div class="loading">LOADING…</div></div></section>
<footer>Protect admin credentials. Only authorized administrators should have access.</footer></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20261020b"></script><script src="admin.js?v=homepagefix1"></script></body></html>
